name: Build CNIoT-CORE A311D

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # 第一步：在磁盘还没被扩容插件折腾前，先安装必备依赖
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libjson-perl rdfind libparse-yapp-perl gperf xsltproc zstd bzip2 patchutils build-essential bc libssl-dev rsync ccache

      # 第二步：深度清理虚拟机空间，腾出约 100GB 空间
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          temp-reserve-mb: 100
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 第三步：注入魔改配置与性能优化
      - name: Pre-Build Fixes
        run: |
          # 1. 强制对齐到仓库根目录
          cd $GITHUB_WORKSPACE
          
          # 2. 动态查找 u-boot 路径，增加容错保护
          # 显式指定从 packages 目录开始找，并排除之前可能残留的备份目录
          UBOOT_PATH=$(find packages/ -name "package.mk" | xargs grep -l 'PKG_NAME="u-boot"' | grep -v "CNIoT-CORE" | head -n 1)
          
          if [ -z "$UBOOT_PATH" ]; then
            echo "错误: 找不到 u-boot 的 package.mk，请检查项目结构！"
            ls -R packages/ | grep u-boot || true
            exit 1
          fi
          
          UBOOT_DIR=$(dirname "$UBOOT_PATH")
          NEW_UBOOT_DIR="${UBOOT_DIR}-CNIoT-CORE"
          
          # 使用双引号包裹变量，防止 cp 报错
          echo "正在克隆 U-Boot 从 $UBOOT_DIR 到 $NEW_UBOOT_DIR"
          cp -r "$UBOOT_DIR" "$NEW_UBOOT_DIR"
          
          # 修改包名
          sed -i 's/PKG_NAME="u-boot"/PKG_NAME="u-boot-CNIoT-CORE"/g' "$NEW_UBOOT_DIR/package.mk"
          
          # 3. 注入 A311D 性能优化参数 (Cortex-A73)
          TARGET_OPTIONS="projects/Amlogic-ce/devices/CNIoT-CORE/options"
          if [ -f "$TARGET_OPTIONS" ]; then
             echo "" >> "$TARGET_OPTIONS" # 换行保护
             echo 'TARGET_CPU="cortex-a73"' >> "$TARGET_OPTIONS"
             echo 'TARGET_CPU_FLAGS="+crc+fp+simd+crypto"' >> "$TARGET_OPTIONS"
             echo "A73 优化参数已成功注入 $TARGET_OPTIONS"
          else
             echo "错误: 找不到设备配置文件 $TARGET_OPTIONS"
             exit 1
          fi
          
          # 4. 自动搬运 DTS（防止文件放错位置导致内核编译失败）
          DTS_PATH="projects/Amlogic-ce/devices/CNIoT-CORE/patches/linux/linux-001-add-cniot-core-dts.patch"
          if [ -f "$DTS_PATH" ]; then
            mkdir -p projects/Amlogic-ce/devices/CNIoT-CORE/boot/
            mv "$DTS_PATH" projects/Amlogic-ce/devices/CNIoT-CORE/boot/meson-g12b-a311d-cniot-core.dts
            echo "检测到 Patch 格式的 DTS，已自动修复到 boot 目录。"
          fi

      

      # 第四步：设置编译缓存 (加速后续构建)
      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # 第五步：正式开始编译
      - name: Build Image
        run: |
          export CCACHE_DIR=$(pwd)/.ccache
          PROJECT=Amlogic-ce ARCH=aarch64 DEVICE=CNIoT-CORE make image

      # 第六步：上传编译产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-A311D-CNIoT
          path: target/*.tar
