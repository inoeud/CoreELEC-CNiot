name: Build CNIoT-CORE A311D

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          remove-android: 'true'
          remove-dotnet: 'true'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libjson-perl rdfind libparse-yapp-perl gperf xsltproc zstd bzip2 patchutils build-essential bc libssl-dev rsync ccache

      - name: Pre-Build Fixes
        run: |
          # 1. 动态克隆 U-Boot 包，绕过构建系统校验
          UBOOT_SRC=$(find packages -name "package.mk" | xargs grep -l 'PKG_NAME="u-boot"' | xargs dirname | head -n 1)
          cp -r "$UBOOT_SRC" "${UBOOT_SRC}-CNIoT-CORE"
          sed -i 's/PKG_NAME="u-boot"/PKG_NAME="u-boot-CNIoT-CORE"/g' "${UBOOT_SRC}-CNIoT-CORE/package.mk"
          
          # 2. 注入 A311D 满血性能优化 (覆盖全局 A53 设置)
          # 我们直接把参数追加到你的设备 options 里
          echo 'TARGET_CPU="cortex-a73"' >> projects/Amlogic-ce/devices/CNIoT-CORE/options
          echo 'TARGET_CPU_FLAGS="+crc+fp+simd+crypto"' >> projects/Amlogic-ce/devices/CNIoT-CORE/options

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build Image
        run: |
          export CCACHE_DIR=$(pwd)/.ccache
          PROJECT=Amlogic-ce ARCH=aarch64 DEVICE=CNIoT-CORE make image

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-A311D-CNIoT
          path: target/*.tar
