name: Build CNIoT-CORE A311D

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 趁着没代码，先暴力扩容，把丢在 /home/runner/work 的空间清理出来
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          temp-reserve-mb: 100
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. 扩容完成后，再拉取源码
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: cniot-core-dev

      # 3. 安装依赖 (此时磁盘已经扩容完成)
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y libjson-perl rdfind libparse-yapp-perl gperf xsltproc zstd bzip2 patchutils build-essential bc libssl-dev rsync ccache

      # 4. 执行魔改逻辑 (此时 packages 目录绝对存在)
      - name: Pre-Build Fixes
        run: |
          # 动态查找并克隆 U-Boot
          UBOOT_PATH=$(find packages/ -name "package.mk" | xargs grep -l 'PKG_NAME="u-boot"' | grep -v "CNIoT-CORE" | head -n 1)
          UBOOT_DIR=$(dirname "$UBOOT_PATH")
          NEW_UBOOT_DIR="${UBOOT_DIR}-CNIoT-CORE"
          
          echo "Cloning U-Boot from $UBOOT_DIR"
          cp -r "$UBOOT_DIR" "$NEW_UBOOT_DIR"
          sed -i 's/PKG_NAME="u-boot"/PKG_NAME="u-boot-CNIoT-CORE"/g' "$NEW_UBOOT_DIR/package.mk"
          
          # 注入 A73 优化
          OPT_FILE="projects/Amlogic-ce/devices/CNIoT-CORE/options"
          echo 'TARGET_CPU="cortex-a73"' >> "$OPT_FILE"
          echo 'TARGET_CPU_FLAGS="+crc+fp+simd+crypto"' >> "$OPT_FILE"
          echo "A73 Optimization Injected."

          # 5. 修复 uboot_helper 识别错误
          # 强制让脚本把 CNIoT-CORE 识别为 G12B (A311D 所在的家族)
          # 注意：请根据你 CoreELEC 版本的具体脚本逻辑，有时需要修改的是 distribution 或 scripts 里的文件
          # 这里我们直接修改 uboot_helper 尝试绕过校验
          sed -i 's/choices=\[.*\]/choices=None/g' ./scripts/uboot_helper || true
          
          # 或者更稳妥的方法：在项目配置里明确 SOC 类型
          # 确保项目的 options 里定义了使用的具体 SoC
          echo 'config_uboot_soc="g12b"' >> projects/Amlogic-ce/devices/CNIoT-CORE/options

      - name: Setup Ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-


      - name: Patch SOC Identity
        run: |
          # 强行给 options 加上 SOC 定义，解决 uboot_helper 报错
          echo 'PKG_ARCH="g12b"' >> projects/Amlogic-ce/devices/CNIoT-CORE/options
          echo 'SOC="g12b"' >> projects/Amlogic-ce/devices/CNIoT-CORE/options
          echo 'config_uboot_soc="g12b"' >> projects/Amlogic-ce/devices/CNIoT-CORE/options

      - name: Build Image
        run: |
          export CCACHE_DIR=$(pwd)/.ccache
          PROJECT=Amlogic-ce ARCH=aarch64 DEVICE=CNIoT-CORE make image

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreELEC-A311D-CNIoT
          path: target/*.tar
